<header><div class="wrap"><div class="brand"><span aria-hidden="true">K</span>KRESZ-gyakorló</div><div class="hero"><h1>Ki mehet először?</h1><p>B kategória · Elsőbbség a kereszteződésben</p></div></div></header>
<main class="wrap">

<script>
'use strict';
const scenarios = [
  ['Jobbkéz-szabály','Két autó egyenesen halad. A kereszteződésben nincs elsőbbséget szabályozó tábla vagy lámpa.', [['S'],['E']], 'BA','A vezető jobb oldaláról érkezik B. B áthaladása után A is mehet.','28. § (1) a)'],
  ['Mi változik egy táblával?','Az autók ugyanonnan érkeznek. B előtt most Elsőbbségadás kötelező tábla van.', [['S'],['E','straight','yield']], 'AB','B előtt elsőbbségadásra kötelező tábla áll. A a keresztező úton érkezik, ezért ő haladhat át először.','28. § (2) b)'],
  ['Három autó egyenrangú kereszteződésben','Mindhárom autó egyenesen menne. Nincs elsőbbséget szabályozó tábla vagy lámpa.', [['S'],['E'],['N']], 'CBA','C jobbjáról senki sem érkezik. B jobbján C van, A jobbján pedig B. C után B, végül A következik.','28. § (1) a)'],
  ['Akkor is meg kell állni?','A előtt STOP tábla van. B a keresztező úton egyenesen halad.', [['S','straight','stop'],['W']], 'BA','A-nak a megállás helyét jelző vonal előtt meg kell állnia, és elsőbbséget kell adnia B-nek. A rajzon A a vonal előtt vár.','12. § (1) b) és 28. § (2) b)'],
  ['Most a másik úton van STOP','A két autó útvonala ugyanaz. Most B előtt áll a STOP tábla, A előtt nincs ilyen korlátozás.', [['S'],['W','straight','stop']], 'AB','Most B-nek kell a vonal előtt megállnia és elsőbbséget adnia A-nak. A tábla áthelyezésével megfordult a sorrend.','12. § (1) b) és 28. § (2) b)'],
  ['Balra kanyarodó autó','A balra fordul, a vele szemben érkező B egyenesen megy. A kereszteződés egyenrangú.', [['S','left'],['N']], 'BA','A balra kanyarodva keresztezi a szemből egyenesen érkező B útját, ezért elsőbbséget ad B-nek.','31. § (5) c) ca)'],
  ['Most B kanyarodik balra','A ugyanonnan érkezik, de most egyenesen megy. A szemből érkező B balra fordul.', [['S'],['N','left']], 'AB','Most B kanyarodik át A útvonalán. B megvárja az egyenesen érkező A-t.','31. § (5) c) ca)'],
  ['Mindkét autónak zöld a lámpa','A zöld körfénynél balra fordul. A szemből érkező B szintén zöld körfényt kapott, és egyenesen halad.', [['S','left','green'],['N','straight','green']], 'BA','A zöld körfény mellett is megmarad a balra kanyarodó A elsőbbségadási kötelezettsége a szemből egyenesen haladó B felé.','9. § (4) a) és 31. § (5) c) ca)'],
  ['Kinek ad szabad utat a lámpa?','A lámpája zöld. A jobbról érkező B lámpája piros. Melyik autó haladhat át a bemutatott jelzésnél?', [['S','straight','green'],['E','straight','red']], 'A','A zöld jelzésre áthaladhat. B a piros fénynél a megállás helyét jelző vonal előtt marad.','9. § (4) a), d)'],
  ['A lámpa váltott','A most pirosat kap. B lámpája zöldre váltott. Melyik autó haladhat át a bemutatott jelzésnél?', [['S','straight','red'],['E','straight','green']], 'B','A pirosnál A vár. B zöld jelzést kapott, a kereszteződés a példában szabad, ezért áthaladhat.','9. § (4) a), d)']
];
const topicTasks = {
  right: [0, 1, 2], signs: [1, 3, 4], turning: [5, 6, 7], lights: [7, 8, 9], narrow: []
};
function addTask(topic, task) {
  topicTasks[topic].push(scenarios.length);
  scenarios.push(task);
}
const approaches = ['S','E','N','W'];
for (const [i, side] of approaches.entries()) {
  const right = approaches[(i+1)%4], opposite = approaches[(i+2)%4];
  const left = approaches[(i+3)%4];
  const from = {S:'déli',E:'keleti',N:'északi',W:'nyugati'}[side];
  addTask('right', [from+' megközelítés · két autó',
    'Egyenrangú kereszteződés, mindkét autó egyenesen halad.', [[side],[left]], 'AB',
    'A a B vezető jobb oldaláról érkezik. B ezért megvárja A-t.', '28. § (1) a)']);
  addTask('right', [from+' megközelítés · három autó',
    'Három autó egyenesen halad. Elsőbbséget szabályozó tábla és lámpa nincs.', [[side],[left],[opposite]], 'ABC',
    'A jobbjáról senki sem jön. B jobbjáról A érkezik, C jobbjáról pedig B, így a sorrend A, B, C.', '28. § (1) a)']);
  addTask('signs', ['Elsőbbségadás '+from+' irányból',
    'A előtt elsőbbségadás kötelező tábla áll. B a keresztező úton jön.', [[side,'straight','yield'],[left]], 'BA',
    'A-nak a tábla miatt elsőbbséget kell adnia B-nek, aki a keresztező úton érkezik.', '12. § (1) a) és 28. § (2) b)']);
  addTask('signs', ['STOP és harmadik autó '+from+' irányból',
    'A előtt STOP tábla van. B és C az ugyanazon keresztező úton, egymással szemben egyenesen haladnak. Melyik autó vár a többire?',
    [[side,'straight','stop'],[right],[left]], 'A',
    'A megáll és elsőbbséget ad B-nek és C-nek. A másik két autó útvonala külön sávban halad, ezért köztük nem kell sorrendet kijelölni.',
    '12. § (1) b) és 28. § (2) b)', {prompt:'Válaszd ki, kinek kell megvárnia a többieket.', animate:['BC','A']}]);
  addTask('turning', ['Balra fordulás '+from+' irányból',
    'A balra kanyarodik, a szemből érkező B jobbra fordul. Ugyanarra az útra kanyarodnak.', [[side,'left'],[opposite,'right']], 'BA',
    'A balra kanyarodó A elsőbbséget ad a szemből jobbra kanyarodó B-nek.', '31. § (5) c) ca)']);
  addTask('turning', ['Balra fordulás zöldnél '+from+' irányból',
    'B balra fordul, A jobbra, ugyanarra az útra. Mindkettejüknek zöld körfény világít.', [[side,'right','green'],[opposite,'left','green']], 'AB',
    'A zöld körfény mellett a balra kanyarodó B elsőbbséget ad a szemből jobbra kanyarodó A-nak.', '9. § (4) a) és 31. § (5) c) ca)']);
  addTask('lights', ['Piros jelzés '+from+' irányból',
    'A pirosat kapott, a keresztező irányból érkező B zöldet. A kereszteződés szabad.', [[side,'straight','red'],[left,'straight','green']], 'B',
    'B a zöldre továbbmehet. A piros fény miatt A a megállás helyét jelző vonal előtt vár.', '9. § (4) a), d)']);
  addTask('lights', ['Zöld jelzés '+from+' irányból',
    'A jelzése zöld, a keresztező irányból érkező B-é piros. A kereszteződés szabad.', [[side,'straight','green'],[left,'straight','red']], 'A',
    'A a zöldre továbbhaladhat. B a pirosnál a megállás helyét jelző vonal előtt vár.', '9. § (4) a), d)']);
}
for (const [place, half] of [['Híd',55],['Aluljáró',76]]) {
  for (const opening of [-31,31]) {
    const straight = opening === 31 ? 'A' : 'B';
    const other = straight === 'A' ? 'B' : 'A';
    addTask('narrow', [place+' tábla nélkül · '+(opening===31?'jobb':'bal')+' oldali átjáró',
      'Az egysávos szakasz mindkét irányból belátható. Nincs elsőbbséget szabályozó jelzés.',
      [['S'],['N']], straight+other,
      straight+' irányváltoztatás nélkül tud áthaladni. '+other+' csak kitéréssel, ezért megvárja '+straight+' áthaladását.',
      '32. § (3)', {narrow:true, opening, half}]);
    addTask('narrow', [place+' táblával · '+(opening===31?'jobb':'bal')+' oldali átjáró',
      'Mindkét autó a szűkület előtt van. Figyeld meg, melyik táblát látják.',
      [['S','straight',other==='A'?'priority':'oncoming'],['N','straight',other==='B'?'priority':'oncoming']],
      other+straight, 'A táblák szabályozzák az elsőbbséget. '+other+' a kék táblát látja, ezért elsőként halad át. '+straight+' megvárja.',
      '12. § (1) c), d) és 32. § (3)', {narrow:true, opening, half}]);
  }
}

const el = id => document.getElementById(id);
const canvas = el('map');
const ctx = canvas.getContext('2d');
const colors = ['#195eb0','#a2421c','#6241a1'];
const directions = {S:'Lentről',E:'Jobbról',N:'Fentről',W:'Balról'};
const angles = {S:0,E:-Math.PI/2,N:Math.PI,W:Math.PI/2};
const motions = {straight:'egyenesen',left:'balra',right:'jobbra'};
const signalNames = {yield:'elsőbbségadás kötelező',stop:'STOP',green:'zöld lámpa',red:'piros lámpa',priority:'elsőbbség a szembejövő forgalommal szemben',oncoming:'a szembejövő forgalom elsőbbsége'};
const ids = 'ABC';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const mixedStorageKey = 'kresz-elsobbseg-v2';
const topicStorageKey = 'kresz-elsobbseg-temakor';
const allTasks = scenarios.map((_, i) => i);
const topics = new Map([['all', allTasks], ...Object.entries(topicTasks), ['trial', allTasks]]);
const sessions = new Map();
let topic = 'all';
try {
  const lastTopic = localStorage.getItem(topicStorageKey);
  if (topics.has(lastTopic)) topic = lastTopic;
} catch {
  // Continue without persistent storage.
}
let queue, results, finished, review, index;
let chosen = [], solved = false, frame = 0;
const phaseTime = 1600;
let elapsed = 0;
let playing = false;

function roundStorageKey() {
  return topic === 'all' ? mixedStorageKey : topicStorageKey + '-' + topic;
}
function isTrial() {
  return topic === 'trial';
}
function shuffledTasks(tasks) {
  const shuffled = [...tasks];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const other = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[other]] = [shuffled[other], shuffled[i]];
  }
  return shuffled.slice(0, 10);
}
function loadProgress() {
  const tasks = topics.get(topic);
  let saved = sessions.get(topic);
  if (!saved) {
    try {
      saved = JSON.parse(localStorage.getItem(roundStorageKey()));
    } catch {
      // An unavailable store or unreadable save starts a fresh round.
    }
  }
  const valid = saved && Array.isArray(saved.queue) && saved.queue.length &&
    new Set(saved.queue).size === saved.queue.length && saved.queue.every(i => tasks.includes(i)) &&
    Number.isInteger(saved.index) && saved.index >= 0 && saved.index < saved.queue.length &&
    Array.isArray(saved.results) && saved.results.every(answer => typeof answer === 'string') &&
    (saved.results.length === saved.index || saved.results.length === saved.index + 1) &&
    typeof saved.finished === 'boolean' && typeof saved.review === 'boolean' &&
    (!saved.finished || saved.results.length === saved.queue.length);
  ({queue, results, index, finished, review} = valid
    ? {...saved, results: [...saved.results]}
    : {queue:isTrial() ? shuffledTasks(tasks) : tasks, results:[], index:0, finished:false, review:false});
}
function saveProgress() {
  const state = {queue, results:[...results], index, finished, review};
  sessions.set(topic, state);
  try {
    localStorage.setItem(roundStorageKey(), JSON.stringify(state));
  } catch {
    // Keep progress in memory while the page is open.
  }
}
function points() {
  return results.filter((answer, i) => answer === scenarios[queue[i]][3]).length;
}
function missedTasks() {
  return queue.filter((task, i) => results[i] !== scenarios[task][3]);
}
let active = scenarios[0];
const source = 'https://net.jogtar.hu/jogszabaly?docid=97500001.KPM';

function label(car, i) {
  const [side, turn = 'straight', signal] = car;
  if(active[6]?.narrow)return ids[i]+' · '+(i===0?'A vezetői nézet autója':'Szembejövő autó')+(signal?' · '+signalNames[signal]:'');
  return ids[i] + ' · ' + directions[side] + ', ' + motions[turn] + (signal ? ' · ' + signalNames[signal] : '');
}
function line(points, color, width, dash = []) {
  ctx.beginPath();
  points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
}
function rect(x,y,w,h,r,fill) {
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill();
}
function polygon(points, color) {
  ctx.beginPath();
  points.forEach(([x,y], i)=>i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function narrowSign(x,y,signal,scale=1, pen=ctx) {
  if(!signal)return;
  pen.save();pen.translate(x,y);pen.scale(scale,scale);
  const priority=signal==='priority';
  if(priority) {
    pen.fillStyle='#1763a2';pen.fillRect(-22,-23,44,46);
    pen.strokeStyle='#fff';pen.lineWidth=2;pen.strokeRect(-20,-21,40,42);
  } else {
    pen.beginPath();pen.arc(0,0,22,0,Math.PI*2);
    pen.fillStyle='#fff';pen.fill();pen.strokeStyle='#ad232c';pen.lineWidth=5;pen.stroke();
  }
  const up=priority?'#fff':'#bf2630';
  const down=priority?'#ed4347':'#171d1c';
  function arrow(points,color,width){
    pen.beginPath();
    points.forEach(([px,py],i)=>i?pen.lineTo(px,py):pen.moveTo(px,py));
    pen.strokeStyle=color;pen.lineWidth=width;pen.stroke();
  }
  arrow([[8,12],[8,-12],[3,-6]],up,4);
  arrow([[8,-12],[13,-6]],up,4);
  arrow([[-8,-12],[-8,12],[-13,6]],down,4);
  arrow([[-8,12],[-3,6]],down,4);
  pen.restore();
}
function drawDriverView(positions) {
  const {opening,half}=active[6];
  const progress=positions.A||0;
  const cameraZ=progress*55;
  const near=35, far=near+half/4;
  const inPassage=Math.min(1,Math.max(0,(cameraZ-(near-15))/12),Math.max(0,(far+11-cameraZ)/10));
  const cameraX=2+(opening/31*2-2)*inPassage;
  const project=(x,z,height=0)=>{
    const scale=535/Math.max(2,z-cameraZ);
    return [300+(x-cameraX)*scale,173+(1.42-height)*scale,scale];
  };

function select(id) {

function refreshChoices() {

    button.setAttribute('aria-label',label(active[2][ids.indexOf(id)],ids.indexOf(id))+(rank?' · '+rank+'. hely':''));

  elapsed=0;
  el('playback').hidden=true;
}
function drawPlayback() {
  const phases=animationPhases();
  const total=animationDuration();
  const positions={};
  phases.forEach((group,i)=>{
    for(const id of group)positions[id]=Math.max(0,Math.min(1,(elapsed-i*phaseTime)/(phaseTime-70)));
  });
  drawMap(positions);
  const status=elapsed===0?'Kiinduló helyzet':elapsed>=total?'Az áthaladás befejeződött':
    'Áthaladás: '+[...phases[Math.floor(elapsed/phaseTime)]].join(' és ');
  if(el('playback-status').textContent!==status)el('playback-status').textContent=status;
  el('timeline').setAttribute('aria-valuetext',status);
  el('timeline').value=Math.round(elapsed/total*1000);
  el('replay').textContent=playing?'Szünet':elapsed>=total?'Újrajátszás':elapsed>0?'Folytatás':'Lejátszás';
  el('previous-frame').disabled=elapsed===0;
  el('next-frame').disabled=elapsed>=total;
}
function togglePlayback() {
  if(playing){
    stopPlayback();
    drawPlayback();
    return;
  }
  if(elapsed>=animationDuration())elapsed=0;
  const start=performance.now()-elapsed;
  playing=true;
  drawPlayback();
  function tick(now) {
    elapsed=Math.min(animationDuration(),now-start);
    if(elapsed>=animationDuration())stopPlayback();
    drawPlayback();
    if(playing)frame=requestAnimationFrame(tick);
  }
  frame=requestAnimationFrame(tick);
}
function seek(time) {
  stopPlayback();
  elapsed=time;
  drawPlayback();
}
function stepPlayback(direction) {
  const midpoints=animationPhases().map((_,i)=>(i+.5)*phaseTime);
  const stops=[0,...midpoints,animationDuration()];
  const target=direction>0?stops.find(t=>t>elapsed):[...stops].reverse().find(t=>t<elapsed);
  if(target!==undefined)seek(target);
}
el('check').onclick=()=>{
  if(solved||chosen.length!==active[3].length)return;
  results[index]=chosen.join('');
  saveProgress();
  showAnswer(true);
};
function showAnswer(animate) {
  solved=true;
  if(isTrial()) {
    refreshChoices();
    showScore();
    el('check').hidden=true;
    el('reset').hidden=true;
    el('next').hidden=false;
    el('next').textContent=index===queue.length-1?'Eredmény':'Következő helyzet';
    if(animate)el('next').focus();
    return;
  }
  const correct=chosen.join('')===active[3];
  const feedback=el('feedback');feedback.dataset.result=correct?'correct':'incorrect';
  const strong=document.createElement('strong');
  strong.textContent=(correct?'Helyes. ':'A helyes megoldás. ')+[...active[3]].join(' → ');
  const explanation=document.createElement('p');explanation.textContent=active[4];
  const link=document.createElement('a');link.href=source;link.target='_blank';link.rel='noopener';link.textContent='KRESZ '+active[5];
  feedback.hidden=false;feedback.replaceChildren(strong,explanation,link);
  refreshChoices();showScore();
  el('check').hidden=true;el('reset').hidden=true;
  el('playback').hidden=false;
  drawPlayback();
  el('next').hidden=false;el('next').textContent=index===queue.length-1?'Eredmény':'Következő helyzet';
  if(animate){el('next').focus();if(!reducedMotion.matches)togglePlayback();}
}
el('reset').onclick=()=>{chosen=[];refreshChoices();el('choices').firstElementChild.focus();};
el('replay').onclick=togglePlayback;
el('timeline').oninput=()=>seek(Number(el('timeline').value)*animationDuration()/1000);
el('previous-frame').onclick=()=>stepPlayback(-1);
el('next-frame').onclick=()=>stepPlayback(1);
el('view').onclick=()=>{
  const driverView=el('view').getAttribute('aria-pressed')==='true';
  viewPreference=!driverView;
  el('view').setAttribute('aria-pressed',String(viewPreference));
  el('view').textContent=driverView?'Vezetői nézet':'Felülnézet';
  if(el('playback').hidden)drawMap();
  else drawPlayback();
};
function startRound(tasks, isReview) {
  queue=tasks;
  review=isReview;
  index=0;
  results=[];
  finished=false;
  saveProgress();
  render(true);
}
function showSummary(focus=false) {
  resetPlayback();
  drawMap();
  const missed=missedTasks();
  if(isTrial()){showTrialSummary(focus);return;}
  el('title').textContent=review?'Befejezted az ismétlést':'Befejezted a gyakorlást';
  el('scenario').textContent=queue.length+' helyzetből '+points()+' feladatot oldottál meg helyesen.';
  el('counter').textContent=review?'Ismétlés vége':'Gyakorlás vége';
  for(const id of ['instruction','choices','feedback','check','reset'])el(id).hidden=true;
  el('next').hidden=false;
  el('next').textContent=missed.length?'Hibás feladatok gyakorlása ('+missed.length+')':(topic==='all'?'Összes feladat újrakezdése':'Témakör újrakezdése');
  el('restart').textContent=topic==='all'?'Összes feladat újrakezdése':'Témakör újrakezdése';
  el('restart').hidden=!missed.length;
  showScore();
  if(focus)el('title').focus();
}
function showTrialSummary(focus) {
  el('title').textContent='Próbakör eredménye';
  el('scenario').textContent=queue.length+' helyzetből '+points()+' feladatot oldottál meg helyesen. Nyisd le a helyzeteket a magyarázathoz.';
  el('counter').textContent='Próbakör vége';
  for(const id of ['instruction','choices','feedback','check','reset','restart','map'])el(id).hidden=true;
  el('sign-panel').hidden=true;
  const list=el('trial-results');
  list.replaceChildren(...queue.map((task, i)=>{
    const [title,, ,answer,explanation]=scenarios[task];
    const item=document.createElement('li');
    const details=document.createElement('details');
    const summary=document.createElement('summary');
    summary.textContent=(results[i]===answer?'Helyes · ':'Hibás · ')+title;
    const text=document.createElement('p');
    text.textContent='Válaszod: '+[...results[i]].join(' → ')+'. Helyes megoldás: '+[...answer].join(' → ')+'. '+explanation;
    details.append(summary,text);
    item.append(details);
    return item;
  }));
  list.hidden=false;
  el('next').hidden=false;
  el('next').textContent='Új próbakör';
  showScore();
  if(focus)el('title').focus();
}
el('restart').onclick=()=>startRound(topics.get(topic),false);
el('next').onclick=()=>{
  if(finished) {
    if(isTrial()){startRound(shuffledTasks(topics.get(topic)),false);return;}
    const missed=missedTasks();
    startRound(missed.length?missed:topics.get(topic),missed.length>0);
    return;
  }
  if(index<queue.length-1){
    index++;
    saveProgress();
    render(true);
    return;
  }
  finished=true;
  saveProgress();
  showSummary(true);
};
function openTopic() {
  el('topic').value=topic;
  loadProgress();
  if(isTrial())saveProgress();
  render();
  if(finished)showSummary();
}
el('topic').onchange=()=>{
  const selected=el('topic').value;
  if(!topics.has(selected) || selected===topic)return;
  saveProgress();
  topic=selected;
  try {
    localStorage.setItem(topicStorageKey, topic);
  } catch {
    // The selection still takes effect for the current page.
  }
  openTopic();
};
openTopic();
</script>
