wrap;margin-top:14px}button{font:inherit;min-height:44px;padding:9px 13px;border:1px solid transparent;border-radius:10px;cursor:pointer}button:disabled{opacity:.58;cursor:default}button:focus-visible,a:focus-visible,h2:focus-visible{outline:3px solid #377fd2;outline-offset:3px}.primary{background:var(--green);color:#fff;font-weight:700}.secondary{background:white;border-color:var(--line);color:var(--ink);font-weight:650}.feedback{margin-top:14px;padding:12px 14px;background:#edf6f0;border-radius:10px;border:1px solid #cce2d4}.feedback[data-result=incorrect]{background:#fff4e3;border-color:#ead8b8}.feedback p{margin:.35rem 0}.feedback a,footer a{color:#125647}.feedback[hidden],[hidden]{display:none!important}footer{color:#3c5750;font-size:.875rem;margin-top:18px}@media(max-width:740px){.grid{grid-template-columns:1fr;gap:12px}.map canvas{max-height:360px;object-fit:contain}.hero{padding-bottom:20px}}

<body>
<header><div class="wrap"><div class="brand"><span aria-hidden="true">K</span>KRESZ-gyakorló</div><div class="hero"><h1>Ki mehet először?</h1><p>B kategória · Elsőbbség a kereszteződésben</p></div></div></header>
<main class="wrap">
<div class="topic-picker">
<label for="topic">Gyakorlási témakör</label>
<select id="topic">
<option value="all">Vegyes gyakorlás · 50 helyzet</option>
<option value="right">Jobbkéz-szabály · 11 helyzet</option>
<option value="signs">Elsőbbségadás és STOP · 11 helyzet</option>
<option value="turning">Balra kanyarodás · 11 helyzet</option>
<option value="lights">Jelzőlámpák · 11 helyzet</option>
<option value="narrow">Útszűkület · 8 helyzet</option>
<option value="trial">Próbakör · 10 kevert helyzet</option>
</select>
</div>
<div class="progress"><span id="counter"></span><span id="score"></span></div>
<progress id="progress" max="10" value="0" aria-label="Megoldott helyzetek"></progress>
<div class="grid">
<figure class="card map"><div class="sign-panel" id="sign-panel" hidden><canvas id="sign-preview" width="100" height="100" aria-hidden="true"></canvas><div><small>Az A autó táblája</small><strong id="sign-name"></strong></div></div><canvas id="map" width="600" height="480" role="img"></canvas><figcaption><span id="caption"></span> <button class="secondary" id="view" aria-pressed="false" hidden>Vezetői nézet</button></figcaption>

<h2 id="title" tabindex="-1"></h2>
<p id="scenario"></p>

</main>
<script>
'use strict';
const scenarios = [
  ['Jobbkéz-szabály','Két autó egyenesen halad. A kereszteződésben nincs elsőbbséget szabályozó tábla vagy lámpa.', [['S'],['E']], 'BA','A vezető jobb oldaláról érkezik B. B áthaladása után A is mehet.','28. § (1) a)'],
  ['Mi változik egy táblával?','Az autók ugyanonnan érkeznek. B előtt most Elsőbbségadás kötelező tábla van.', [['S'],['E','straight','yield']], 'AB','B előtt elsőbbségadásra kötelező tábla áll. A a keresztező úton érkezik, ezért ő haladhat át először.','28. § (2) b)'],
  ['Három autó egyenrangú kereszteződésben','Mindhárom autó egyenesen menne. Nincs elsőbbséget szabályozó tábla vagy lámpa.', [['S'],['E'],['N']], 'CBA','C jobbjáról senki sem érkezik. B jobbján C van, A jobbján pedig B. C után B, végül A következik.','28. § (1) a)'],
  ['Akkor is meg kell állni?','A előtt STOP tábla van. B a keresztező úton egyenesen halad.', [['S','straight','stop'],['W']], 'BA','A-nak a megállás helyét jelző vonal előtt meg kell állnia, és elsőbbséget kell adnia B-nek. A rajzon A a vonal előtt vár.','12. § (1) b) és 28. § (2) b)'],
  ['Most a másik úton van STOP','A két autó útvonala ugyanaz. Most B előtt áll a STOP tábla, A előtt nincs ilyen korlátozás.', [['S'],['W','straight','stop']], 'AB','Most B-nek kell a vonal előtt megállnia és elsőbbséget adnia A-nak. A tábla áthelyezésével megfordult a sorrend.','12. § (1) b) és 28. § (2) b)'],
  ['Balra kanyarodó autó','A balra fordul, a vele szemben érkező B egyenesen megy. A kereszteződés egyenrangú.', [['S','left'],['N']], 'BA','A balra kanyarodva keresztezi a szemből egyenesen érkező B útját, ezért elsőbbséget ad B-nek.','31. § (5) c) ca)'],
  ['Most B kanyarodik balra','A ugyanonnan érkezik, de most egyenesen megy. A szemből érkező B balra fordul.', [['S'],['N','left']], 'AB','Most B kanyarodik át A útvonalán. B megvárja az egyenesen érkező A-t.','31. § (5) c) ca)'],
  ['Mindkét autónak zöld a lámpa','A zöld körfénynél balra fordul. A szemből érkező B szintén zöld körfényt kapott, és egyenesen halad.', [['S','left','green'],['N','straight','green']], 'BA','A zöld körfény mellett is megmarad a balra kanyarodó A elsőbbségadási kötelezettsége a szemből egyenesen haladó B felé.','9. § (4) a) és 31. § (5) c) ca)'],
  ['Kinek ad szabad utat a lámpa?','A lámpája zöld. A jobbról érkező B lámpája piros. Melyik autó haladhat át a bemutatott jelzésnél?', [['S','straight','green'],['E','straight','red']], 'A','A zöld jelzésre áthaladhat. B a piros fénynél a megállás helyét jelző vonal előtt marad.','9. § (4) a), d)'],
  ['A lámpa váltott','A most pirosat kap. B lámpája zöldre váltott. Melyik autó haladhat át a bemutatott jelzésnél?', [['S','straight','red'],['E','straight','green']], 'B','A pirosnál A vár. B zöld jelzést kapott, a kereszteződés a példában szabad, ezért áthaladhat.','9. § (4) a), d)']
];
const topicTasks = {
  right: [0, 1, 2], signs: [1, 3, 4], turning: [5, 6, 7], lights: [7, 8, 9], narrow: []
};
function addTask(topic, task) {
  topicTasks[topic].push(scenarios.length);
  scenarios.push(task);
}
const approaches = ['S','E','N','W'];
for (const [i, side] of approaches.entries()) {
  const right = approaches[(i+1)%4], opposite = approaches[(i+2)%4];
  const left = approaches[(i+3)%4];
  const from = {S:'déli',E:'keleti',N:'északi',W:'nyugati'}[side];
  addTask('right', [from+' megközelítés · két autó',
    'Egyenrangú kereszteződés, mindkét autó egyenesen halad.', [[side],[left]], 'AB',
    'A a B vezető jobb oldaláról érkezik. B ezért megvárja A-t.', '28. § (1) a)']);
  addTask('right', [from+' megközelítés · három autó',
    'Három autó egyenesen halad. Elsőbbséget szabályozó tábla és lámpa nincs.', [[side],[left],[opposite]], 'ABC',
    'A jobbjáról senki sem jön. B jobbjáról A érkezik, C jobbjáról pedig B, így a sorrend A, B, C.', '28. § (1) a)']);
  addTask('signs', ['Elsőbbségadás '+from+' irányból',
    'A előtt elsőbbségadás kötelező tábla áll. B a keresztező úton jön.', [[side,'straight','yield'],[left]], 'BA',
    'A-nak a tábla miatt elsőbbséget kell adnia B-nek, aki a keresztező úton érkezik.', '12. § (1) a) és 28. § (2) b)']);
  addTask('signs', ['STOP és harmadik autó '+from+' irányból',
    'A előtt STOP tábla van. B és C az ugyanazon keresztező úton, egymással szemben egyenesen haladnak. Melyik autó vár a többire?',
    [[side,'straight','stop'],[right],[left]], 'A',
    'A megáll és elsőbbséget ad B-nek és C-nek. A másik két autó útvonala külön sávban halad, ezért köztük nem kell sorrendet kijelölni.',
    '12. § (1) b) és 28. § (2) b)', {prompt:'Válaszd ki, kinek kell megvárnia a többieket.', animate:['BC','A']}]);
  addTask('turning', ['Balra fordulás '+from+' irányból',
    'A balra kanyarodik, a szemből érkező B jobbra fordul. Ugyanarra az útra kanyarodnak.', [[side,'left'],[opposite,'right']], 'BA',
    'A balra kanyarodó A elsőbbséget ad a szemből jobbra kanyarodó B-nek.', '31. § (5) c) ca)']);
  addTask('turning', ['Balra fordulás zöldnél '+from+' irányból',
    'B balra fordul, A jobbra, ugyanarra az útra. Mindkettejüknek zöld körfény világít.', [[side,'right','green'],[opposite,'left','green']], 'AB',
    'A zöld körfény mellett a balra kanyarodó B elsőbbséget ad a szemből jobbra kanyarodó A-nak.', '9. § (4) a) és 31. § (5) c) ca)']);
  addTask('lights', ['Piros jelzés '+from+' irányból',
    'A pirosat kapott, a keresztező irányból érkező B zöldet. A kereszteződés szabad.', [[side,'straight','red'],[left,'straight','green']], 'B',
    'B a zöldre továbbmehet. A piros fény miatt A a megállás helyét jelző vonal előtt vár.', '9. § (4) a), d)']);
  addTask('lights', ['Zöld jelzés '+from+' irányból',
    'A jelzése zöld, a keresztező irányból érkező B-é piros. A kereszteződés szabad.', [[side,'straight','green'],[left,'straight','red']], 'A',
    'A a zöldre továbbhaladhat. B a pirosnál a megállás helyét jelző vonal előtt vár.', '9. § (4) a), d)']);
}
for (const [place, half] of [['Híd',55],['Aluljáró',76]]) {
  for (const opening of [-31,31]) {
    const straight = opening === 31 ? 'A' : 'B';
    const other = straight === 'A' ? 'B' : 'A';
    addTask('narrow', [place+' tábla nélkül · '+(opening===31?'jobb':'bal')+' oldali átjáró',
      'Az egysávos szakasz mindkét irányból belátható. Nincs elsőbbséget szabályozó jelzés.',
      [['S'],['N']], straight+other,
      straight+' irányváltoztatás nélkül tud áthaladni. '+other+' csak kitéréssel, ezért megvárja '+straight+' áthaladását.',
      '32. § (3)', {narrow:true, opening, half}]);
    addTask('narrow', [place+' táblával · '+(opening===31?'jobb':'bal')+' oldali átjáró',
      'Mindkét autó a szűkület előtt van. Figyeld meg, melyik táblát látják.',
      [['S','straight',other==='A'?'priority':'oncoming'],['N','straight',other==='B'?'priority':'oncoming']],
      other+straight, 'A táblák szabályozzák az elsőbbséget. '+other+' a kék táblát látja, ezért elsőként halad át. '+straight+' megvárja.',
      '12. § (1) c), d) és 32. § (3)', {narrow:true, opening, half}]);
  }
}

const el = id => document.getElementById(id);
const canvas = el('map');
const ctx = canvas.getContext('2d');
const colors = ['#195eb0','#a2421c','#6241a1'];
const directions = {S:'Lentről',E:'Jobbról',N:'Fentről',W:'Balról'};
const angles = {S:0,E:-Math.PI/2,N:Math.PI,W:Math.PI/2};
const motions = {straight:'egyenesen',left:'balra',right:'jobbra'};
const signalNames = {yield:'elsőbbségadás kötelező',stop:'STOP',green:'zöld lámpa',red:'piros lámpa',priority:'elsőbbség a szembejövő forgalommal szemben',oncoming:'a szembejövő forgalom elsőbbsége'};
const ids = 'ABC';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const mixedStorageKey = 'kresz-elsobbseg-v2';
const topicStorageKey = 'kresz-elsobbseg-temakor';
const allTasks = scenarios.map((_, i) => i);
const topics = new Map([['all', allTasks], ...Object.entries(topicTasks), ['trial', allTasks]]);
const sessions = new Map();
let topic = 'all';
try {
  const lastTopic = localStorage.getItem(topicStorageKey);
  if (topics.has(lastTopic)) topic = lastTopic;
} catch {
  // Continue without persistent storage.
}
let queue, results, finished, review, index;
let chosen = [], solved = false, frame = 0;
const phaseTime = 1600;
let elapsed = 0;
let playing = false;

function roundStorageKey() {
  return topic === 'all' ? mixedStorageKey : topicStorageKey + '-' + topic;
}
function isTrial() {
  return topic === 'trial';
}
function shuffledTasks(tasks) {
  const shuffled = [...tasks];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const other = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[other]] = [shuffled[other], shuffled[i]];
  }
  return shuffled.slice(0, 10);
}
function loadProgress() {
  const tasks = topics.get(topic);
  let saved = sessions.get(topic);
  if (!saved) {
    try {
      saved = JSON.parse(localStorage.getItem(roundStorageKey()));
    } catch {
      // An unavailable store or unreadable save starts a fresh round.
    }
  }
  const valid = saved && Array.isArray(saved.queue) && saved.queue.length &&
    new Set(saved.queue).size === saved.queue.length && saved.queue.every(i => tasks.includes(i)) &&
    Number.isInteger(saved.index) && saved.index >= 0 && saved.index < saved.queue.length &&
    Array.isArray(saved.results) && saved.results.every(answer => typeof answer === 'string') &&
    (saved.results.length === saved.index || saved.results.length === saved.index + 1) &&
    typeof saved.finished === 'boolean' && typeof saved.review === 'boolean' &&
    (!saved.finished || saved.results.length === saved.queue.length);
  ({queue, results, index, finished, review} = valid
    ? {...saved, results: [...saved.results]}
    : {queue:isTrial() ? shuffledTasks(tasks) : tasks, results:[], index:0, finished:false, review:false});
}
function saveProgress() {
  const state = {queue, results:[...results], index, finished, review};
  sessions.set(topic, state);
  try {
    localStorage.setItem(roundStorageKey(), JSON.stringify(state));
  } catch {
    // Keep progress in memory while the page is open.
  }
}
function points() {
  return results.filter((answer, i) => answer === scenarios[queue[i]][3]).length;
}
function missedTasks() {
  return queue.filter((task, i) => results[i] !== scenarios[task][3]);
}
let active = scenarios[0];
const source = 'https://net.jogtar.hu/jogszabaly?docid=97500001.KPM';

function label(car, i) {
  const [side, turn = 'straight', signal] = car;
  if(active[6]?.narrow)return ids[i]+' · '+(i===0?'A vezetői nézet autója':'Szembejövő autó')+(signal?' · '+signalNames[signal]:'');
  return ids[i] + ' · ' + directions[side] + ', ' + motions[turn] + (signal ? ' · ' + signalNames[signal] : '');
}
function line(points, color, width, dash = []) {
  ctx.beginPath();
  points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]);
}
function rect(x,y,w,h,r,fill) {
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill();
}
function polygon(points, color) {
  ctx.beginPath();
  points.forEach(([x,y], i)=>i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function narrowSign(x,y,signal,scale=1, pen=ctx) {
  if(!signal)return;
  pen.save();pen.translate(x,y);pen.scale(scale,scale);
  const priority=signal==='priority';
  if(priority) {
    pen.fillStyle='#1763a2';pen.fillRect(-22,-23,44,46);
    pen.strokeStyle='#fff';pen.lineWidth=2;pen.strokeRect(-20,-21,40,42);
  } else {
    pen.beginPath();pen.arc(0,0,22,0,Math.PI*2);
    pen.fillStyle='#fff';pen.fill();pen.strokeStyle='#ad232c';pen.lineWidth=5;pen.stroke();
  }
  const up=priority?'#fff':'#bf2630';
  const down=priority?'#ed4347':'#171d1c';
  function arrow(points,color,width){
    pen.beginPath();
    points.forEach(([px,py],i)=>i?pen.lineTo(px,py):pen.moveTo(px,py));
    pen.strokeStyle=color;pen.lineWidth=width;pen.stroke();
  }
  arrow([[8,12],[8,-12],[3,-6]],up,4);
  arrow([[8,-12],[13,-6]],up,4);
  arrow([[-8,-12],[-8,12],[-13,6]],down,4);
  arrow([[-8,12],[-3,6]],down,4);

const roadMaterials = new Map();
function prepareRoadMaterials() {
  for(const [name,source] of Object.entries(materialSources)){
    const image=new Image();
    image.onload=()=>{
      roadMaterials.set(name,image);
      if(!el('playback').hidden)drawPlayback();
      else drawMap();
    };
    image.src=source;
  }
}
function materialPolygon(points,base,material,opacity=.75) {
  polygon(points,base);
  const image=roadMaterials.get(material);
  if(!image)return;
  ctx.save();
  ctx.clip();
  ctx.globalAlpha=opacity;
  ctx.fillStyle=ctx.createPattern(image,'repeat');
  ctx.fillRect(0,0,600,480);
  ctx.restore();
}
function paintSky() {
  const sky=ctx.createLinearGradient(0,0,0,184);
  sky.addColorStop(0,'#789fb5');sky.addColorStop(1,'#dce6e7');
  ctx.fillStyle=sky;ctx.fillRect(0,0,600,183);
  const cloud=roadMaterials.get('cloud');
  if(cloud){
    ctx.globalAlpha=.82;
    ctx.drawImage(cloud,0,0,600,184);
    ctx.globalAlpha=1;
  }
}
function paintDashboard(label) {
  const dash=ctx.createLinearGradient(0,388,0,480);

  polygon([[0,480],[0,419],[74,396],[161,397],[232,417],[368,417],[439,397],[526,396],[600,419],[600,480]],dash);

function drawDriverView(positions) {
  const {opening,half}=active[6];
  const progress=positions.A||0;
  const cameraZ=progress*55;
  const near=35, far=near+half/4;
  const inPassage=Math.min(1,Math.max(0,(cameraZ-(near-15))/12),Math.max(0,(far+11-cameraZ)/10));
  const cameraX=2+(opening/31*2-2)*inPassage;
  const project=(x,z,height=0)=>{
    const scale=535/Math.max(2,z-cameraZ);
    return [300+(x-cameraX)*scale,173+(1.42-height)*scale,scale];
  };
  const surface=(points,color,material,opacity)=>materialPolygon(points.map(point=>project(...point)),color,material,opacity);
  paintSky();
  materialPolygon([[0,166],[89,146],[145,157],[228,142],[324,163],[420,144],[505,151],[600,165],[600,480],[0,480]],'#63854c','grass',.79);
  const front=cameraZ+2;
  surface([[-5.4,front],[-5.4,150],[5.4,150],[5.4,front]],'#a6987c');
  surface([[-4,front],[-4,150],[4,150],[4,front]],'#454e52','asphalt',.68);
  for(const x of [-3.85,3.85]) {
    line([project(x,front),project(x,150)],'#e5dfc9',2);
  }
  for(let z=7;z<125;z+=7){
    if(z<front || (z>near-5 && z<far+4))continue;
    surface([[-.06,z],[.06,z],[.06,z+2.7],[-.06,z+2.7]],'#e8e3d0');
  }
  ctx.save();ctx.globalAlpha=.24;
  for(let i=0;i<180;i++) {
    const z=front+1+(i*37%103), x=(i*61%770)/100-3.85;
    const [sx,sy,scale]=project(x,z);
    if(sy<480)rect(sx,sy,Math.max(1,scale*.03),1,0,i%2?'#9ca4a1':'#161e21');
  }
  ctx.restore();

  const openingCenter=opening>0?2:-2;
  const leftEdge=openingCenter-1.95, rightEdge=openingCenter+1.95;
  function portal(z){
    surface([[-18,z,0],[leftEdge,z,0],[leftEdge,z,4.1],[-18,z,4.1]],'#6e7270','concrete',.73);
    surface([[rightEdge,z,0],[18,z,0],[18,z,4.1],[rightEdge,z,4.1]],'#7c817c','concrete',.73);
    surface([[-18,z,3.7],[18,z,3.7],[18,z,4.62],[-18,z,4.62]],'#a6a69a','concrete',.73);
    surface([[-18,z,3.72],[18,z,3.72],[18,z,3.97],[-18,z,3.97]],'#4c5352');
    for(let i=-17;i<=17;i++){
      line([project(i,z,4.55),project(i,z,5.3)],'#303f3e',1.5);
    }
    line([project(-18,z,5.26),project(18,z,5.26)],'#303f3e',2);
    for(const x of [leftEdge,rightEdge]){
      surface([[x-.13,z-.1,.12],[x+.13,z-.1,.12],[x+.13,z-.1,2.1],[x-.13,z-.1,2.1]],'#f4eddd');
      for(let i=0;i<4;i++){
        const h=.18+i*.43;
        surface([[x-.13,z-.15,h],[x+.13,z-.15,h+.15],[x+.13,z-.15,h+.33],[x-.13,z-.15,h+.18]],'#a9382b');
      }
    }
  }
  if(far>front)portal(far);
  if(near>front){
    surface([[leftEdge,near,3.7],[rightEdge,near,3.7],[rightEdge,far,3.7],[leftEdge,far,3.7]],'#414b49');
    surface([[leftEdge,near],[leftEdge,far],[leftEdge,far,3.7],[leftEdge,near,3.7]],'#575e58','concrete',.73);
    surface([[rightEdge,near],[rightEdge,far],[rightEdge,far,3.7],[rightEdge,near,3.7]],'#4d5651','concrete',.73);
    portal(near);
  }
  const t=positions.B||0;
  if(t<1){
    const z=far+9-t*(far+10);
    if(z>cameraZ+2.5){
      const align=Math.max(0,Math.min(1,(z-near+13)/13));
      const x=-2+(openingCenter+2)*align;
      const [sx,sy,k]=project(x,z);
      ctx.save();ctx.translate(sx,sy);ctx.scale(k,k);
      ctx.beginPath();ctx.ellipse(0,-.02,1.04,.2,0,0,Math.PI*2);ctx.fillStyle='#121c2199';ctx.fill();
      rect(-.86,-.48,.21,.52,.06,'#101818');rect(.65,-.48,.21,.52,.06,'#101818');
      polygon([[-.8,-.55],[-.56,-1.16],[-.36,-1.28],[.38,-1.28],[.6,-1.14],[.82,-.55]],'#c07927');
      polygon([[-.58,-.68],[-.46,-1.09],[.45,-1.09],[.6,-.68]],'#223a45');

      rect(-.72,-.49,.29,.13,.04,'#fff6d0');rect(.43,-.49,.29,.13,.04,'#fff6d0');
      rect(-.22,-.21,.44,.12,.02,'#e3e5dc');

      rect(sx-11,sy-k*1.5-17,22,20,5,'#733915');ctx.fillText('B',sx,sy-k*1.5-2);
    }

  const signal=active[2][0][2];

    const [sx,sy,k]=project(5,signZ,2.7);
    line([[sx,sy],project(5,signZ)],'#4b5c58',Math.max(2,k*.1));
    narrowSign(sx,sy,signal,k*.021);

  paintDashboard(progress>0?'A autó · áthaladás':'A autó · vezetői nézet');

function drawNarrow(positions={}) {
  const {opening,half}=active[6];
  const fromDriver=el('view').getAttribute('aria-pressed')==='true';
  const obstaclesX=300-opening;
  if(fromDriver){drawDriverView(positions);return;}
  ctx.fillStyle='#bfd2b1';ctx.fillRect(0,0,600,480);
  ctx.fillStyle='#e7e7d9';ctx.fillRect(220,0,160,480);
  ctx.fillStyle='#424c51';ctx.fillRect(228,0,144,480);
  line([[300,0],[300,240-half-18]],'#cbd2ca',2,[10,8]);
  line([[300,240+half+18],[300,480]],'#cbd2ca',2,[10,8]);
  rect(obstaclesX-35,240-half,70,half*2,6,'#d3cbbc');
  for(let y=250-half;y<238+half;y+=16)rect(obstaclesX-28,y,56,5,1,'#ae4d3e');
  narrowSign(408,240+half+36,active[2][0][2]);
  narrowSign(192,240-half-36,active[2][1][2]);
  for(const [i,id] of ['A','B'].entries()){
    const t=positions[id]||0;
    if(t>=1)continue;
    const direction=i===0?1:-1;

    const x=300+startLane+(opening-startLane)*near;
    ctx.save();ctx.translate(x,y);ctx.rotate(i===0?0:Math.PI);ctx.translate(-31,-117);
    drawCar(i,i===0?'S':'N','straight',0);
    ctx.restore();

}

function rotatePoint(x,y,angle) {
  return [x*Math.cos(angle)-y*Math.sin(angle),x*Math.sin(angle)+y*Math.cos(angle)];
}
function drawJunctionDriver(positions) {
  const [approach,turn='straight']=active[2][0];
  const t=positions.A||0;
  const [ax,ay,heading]=carPose(turn,t);
  const angle=angles[approach];
  const [cx,cy]=rotatePoint(ax,ay,angle);
  const yaw=angle+heading;
  const viewPoint=(x,y,height=0)=>{
    const [horizontal,depth]=rotatePoint(x-cx,y-cy,-yaw);
    return [horizontal, -depth+34, height];
  };
  const project=([x,z,h])=>[300+241*x/z,179+241*(39-h)/z];
  const near=19;
  function face(points,fill,material,opacity){
    const view=points.map(point=>viewPoint(...point));
    const clipped=[];
    view.forEach((point,i)=>{
      const previous=view[(i+view.length-1)%view.length];
      if((point[1]>=near)!==(previous[1]>=near)){
        const ratio=(near-previous[1])/(point[1]-previous[1]);
        clipped.push([previous[0]+ratio*(point[0]-previous[0]),near,previous[2]+ratio*(point[2]-previous[2])]);
      }
      if(point[1]>=near)clipped.push(point);
    });
    if(clipped.length>=3)materialPolygon(clipped.map(project),fill,material,opacity);
  }
  function ground(x1,y1,x2,y2,color,material,opacity) {
    face([[x1,y1],[x2,y1],[x2,y2],[x1,y2]],color,material,opacity);
  }
  paintSky();
  materialPolygon([[0,179],[600,179],[600,480],[0,480]],'#78905b','grass',.75);
  for(let i=0;i<33;i++){
    const x=i*20,y=179,h=8+i*7%19;
    polygon([[x-12,y],[x-9,y-h*.62],[x,y-h],[x+9,y-h*.62],[x+12,y]],i%2?'#5a754c':'#6e875d');
  }
  ground(-1200,-80,1200,80,'#b1a68c');
  ground(-80,-1200,80,1200,'#b1a68c');
  ground(-1200,-71,1200,71,'#454f54','asphalt',.71);
  ground(-71,-1200,71,1200,'#454f54','asphalt',.71);
  for(const direction of Object.values(angles)){
    for(let y=92;y<430;y+=35){
      face([[-1,y],[1,y],[1,y+18],[-1,y+18]].map(([x,z])=>rotatePoint(x,z,direction)),'#dce3df');
    }
    for(const x of [-68,68]){
      face([[x-1,79],[x+1,79],[x+1,1200],[x-1,1200]].map(([a,b])=>rotatePoint(a,b,direction)),'#d1d5c9');
    }
  }
  const objects=[];
  active[2].forEach(([side,motion='straight',signal],i)=>{
    const rotation=angles[side];
    if(signal){
      const [x,y]=rotatePoint(92,93,rotation);
      const marker=viewPoint(x,y,52);
      if(marker[1]>near)objects.push({depth:marker[1],draw:()=>{
        const [sx,sy]=project(marker);
        line([[sx,sy],project(viewPoint(x,y))],'#303f3e',Math.max(2,210/marker[1]));
        ctx.save();ctx.translate(sx,sy);ctx.scale(127/marker[1],127/marker[1]);ctx.translate(-94,-101);
        drawSignal(signal,false);
        ctx.restore();
      }});
      if(signal!=='yield'){
        face([[3,74],[68,74],[68,79],[3,79]].map(([x,y])=>rotatePoint(x,y,rotation)),'#f2f1e8');
      }
    }
    const progress=positions[ids[i]]||0;
    if(i===0||progress>=1)return;
    const [localX,localY,steer]=carPose(motion,progress);
    const [x,y]=rotatePoint(localX,localY,rotation);
    const marker=viewPoint(x,y,36);
    objects.push({depth:marker[1],draw:()=>{
      const local=(a,b,h)=>{
        const [dx,dy]=rotatePoint(a,b,rotation+steer);
        return [x+dx,y+dy,h];
      };
      const shape=(points,color)=>face(points.map(p=>local(...p)),color);
      shape([[-18,-28,0],[18,-28,0],[18,28,0],[-18,28,0]],'#222b2e');
      const sides=[
        [[-17,-27,6],[-17,27,6],[-17,27,19],[-17,-27,19]],
        [[17,-27,6],[17,27,6],[17,27,19],[17,-27,19]],
        [[-17,-27,6],[17,-27,6],[17,-27,19],[-17,-27,19]],
        [[-17,27,6],[17,27,6],[17,27,19],[-17,27,19]]
      ];
      for(const [side,points] of sides.entries()){
        shape(points,colors[i]);
        if(side%2===0)shape(points,'#111a2340');
      }
      for(const side of [-1,1]) {
        for(const axle of [-17,17]){
          const tire=Array.from({length:12},(_,j)=>{
            const angle=j*Math.PI/6;
            return [side*17.2,axle+Math.cos(angle)*6,5.7+Math.sin(angle)*5.5];
          });
          shape(tire,'#171c20');
          shape(tire.map(([a,b,h])=>[a,b*.52+axle*.48,h*.52+2.74]),'#9ca5a9');
        }
      }
      shape([[-17,-27,19],[17,-27,19],[17,27,19],[-17,27,19]],colors[i]);
      shape([[-13,-26,19.1],[13,-26,19.1],[10,-14,19.1],[-10,-14,19.1]],'#ffffff18');
      for(const [end,color] of [[-27.2,'#f0ece0'],[27.2,'#dd5c55']]){
        for(const side of [-1,1]){
          shape([[side*7,end,11],[side*15,end,11],[side*15,end,15],[side*7,end,15]],color);
        }
        shape([[-4,end,8],[4,end,8],[4,end,11],[-4,end,11]],'#e5e7e0');
      }
      shape([[-13,-15,19],[13,-15,19],[11,-7,32],[-11,-7,32]],'#accbd5');
      shape([[-13,16,19],[13,16,19],[11,8,32],[-11,8,32]],'#7c9aa8');
      shape([[-13,-15,19],[-13,16,19],[-11,8,32],[-11,-7,32]],'#587987');
      shape([[13,-15,19],[13,16,19],[11,8,32],[11,-7,32]],'#587987');
      shape([[-11,-7,32],[11,-7,32],[11,8,32],[-11,8,32]],colors[i]);
      if(marker[1]>near){
        const [sx,sy]=project(marker);
        rect(sx-11,sy-20,22,20,5,colors[i]);
        ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';
        ctx.fillText(ids[i],sx,sy-5);
      }
    }});
  });
  objects.sort((a,b)=>b.depth-a.depth).forEach(object=>object.draw());
  paintDashboard(t>0?'A autó · áthaladás':'A autó · vezetői nézet');
}

  if(el('view').getAttribute('aria-pressed')==='true'){drawJunctionDriver(positions);return;}
  ctx.fillStyle='#c7d9bf'; ctx.fillRect(0,0,600,480);
  for (const [x,y] of [[42,38],[96,118],[170,61],[454,49],[541,115],[564,50],[64,391],[146,435],[486,400],[555,435]]) {
    ctx.beginPath(); ctx.arc(x,y,19,0,Math.PI*2); ctx.fillStyle='#a9c69e'; ctx.fill();
    ctx.beginPath(); ctx.arc(x+4,y-3,12,0,Math.PI*2); ctx.fillStyle='#b5d1a9'; ctx.fill();
  }
  ctx.save(); ctx.translate(300,240);
  ctx.fillStyle='#edf0e2'; ctx.fillRect(-600,-80,1200,160); ctx.fillRect(-80,-600,160,1200);
  ctx.fillStyle='#424c51'; ctx.fillRect(-600,-71,1200,142); ctx.fillRect(-71,-600,142,1200);
  for (const angle of Object.values(angles)) {
    ctx.save(); ctx.rotate(angle);

    ctx.restore();
  }
  active[2].forEach(([side,turn = 'straight',signal],i) => {
    ctx.save(); ctx.rotate(angles[side]);
    const end = turn === 'left' ? [-124,-31] : turn === 'right' ? [124,31] : [31,-127];
    const path = turn === 'left' ? [[31,117],[31,40],[8,-10],[-40,-31],end]
      : turn === 'right' ? [[31,117],[31,70],[42,42],[66,31],end] : [[31,117],end];
    line(path,colors[i],5,[8,6]);
    const [x,y] = end;
    const arrow = turn==='straight' ? [[x-8,y+13],[x,y],[x+8,y+13]]
      : [[x+(turn==='left'?13:-13),y-8],[x,y],[x+(turn==='left'?13:-13),y+8]];

    if (signal) drawSignal(signal);
    const time = positions[ids[i]] || 0;
    if (time < 1) drawCar(i,side,turn,time);
    ctx.restore();
  });
  ctx.restore();
}
function drawSignal(signal,markStop=true) {
  if (markStop && signal!=='yield') line([[3,76],[68,76]],'#f9faf6',4);
  ctx.save(); ctx.translate(94,101);
  if (signal==='stop') {
    ctx.beginPath();
    for(let i=0;i<8;i++) {
      const a=Math.PI/8+i*Math.PI/4;
      if(i===0)ctx.moveTo(Math.cos(a)*21,Math.sin(a)*21);
      else ctx.lineTo(Math.cos(a)*21,Math.sin(a)*21);
    }
    ctx.closePath();ctx.fillStyle='#b82029';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('STOP',0,4);
  } else if (signal==='yield') {
    ctx.beginPath();ctx.moveTo(-20,-13);ctx.lineTo(20,-13);ctx.lineTo(0,18);ctx.closePath();
    ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#c52d31';ctx.lineWidth=5;ctx.stroke();
  } else {
    rect(-14,-24,28,48,7,'#202d30');
    for (const [i,color] of ['red','yellow','green'].entries()) {
      ctx.beginPath();ctx.arc(0,i*14-14,5,0,Math.PI*2);
      ctx.fillStyle=signal===color ? (color==='red'?'#ff656b':'#54ec9d'):'#566267';ctx.fill();
    }
  }
  ctx.restore();
}
function carPose(turn,t) {
  let x=31, y=117-320*t, heading=0;
  if(turn==='left') {
    if(t<=.22) y=117-68*t/.22;
    else if(t<.58) {
      const arc=(t-.22)/.36*Math.PI/2;
      x=-49+80*Math.cos(arc);y=49-80*Math.sin(arc);heading=-arc;
    } else {
      x=-49-235*(t-.58)/.42;y=-31;heading=-Math.PI/2;
    }
  }
  if(turn==='right') {
    if(t<=.22) y=117-51*t/.22;
    else if(t<.58) {
      const arc=(t-.22)/.36*Math.PI/2;
      x=66-35*Math.cos(arc);y=66-35*Math.sin(arc);heading=arc;
    } else {
      x=66+235*(t-.58)/.42;y=31;heading=Math.PI/2;
    }
  }
  return [x,y,heading];
}
function drawCar(i,side,turn,t) {
  const [x,y,heading]=carPose(turn,t);
  ctx.save();ctx.translate(x,y);ctx.rotate(heading);
  rect(-17,-28,34,56,9,'#eaf3ee');
  rect(-15,-26,30,52,8,colors[i]);
  rect(-11,-20,22,10,3,'#bce3ec');
  rect(-10,12,20,7,3,'#bce3ec');
  ctx.rotate(-angles[side]-heading);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 17px system-ui';ctx.fillText(ids[i],0,1);ctx.restore();
}
function showScore() {
  el('score').textContent=isTrial()&&!finished ? results.length+' rögzítve' : points()+' helyes';
  el('progress').max=queue.length;
  el('progress').value=results.length;
}
let viewPreference;
function render(focus=false) {
  resetPlayback();
  active=scenarios[queue[index]];chosen=[];solved=false;
  el('counter').textContent=(review?'Ismétlés · ':'')+(index+1)+' / '+queue.length+' helyzet';
  el('title').textContent=isTrial()?'Próbakör':active[0];
  el('scenario').textContent=isTrial()?'A megoldásokat és a magyarázatokat a kör végén látod.':active[1];
  el('check').textContent=isTrial()?'Válasz rögzítése':'Ellenőrzés';
  const single=active[3].length===1;
  el('instruction').textContent=active[6]?.prompt || (single?'Válaszd ki az autót, amelyik ennél a jelzésnél áthaladhat.':'Jelöld a járműveket az áthaladás sorrendjében. Újabb koppintással visszavonhatsz egy választást.');
  const narrow=active[6]?.narrow;
  const driverView=viewPreference ?? true;
  el('view').setAttribute('aria-pressed',String(driverView));
  const sign=narrow?active[2][0][2]:null;
  el('sign-panel').hidden=!sign;
  if(sign){
    const signContext=el('sign-preview').getContext('2d');
    signContext.clearRect(0,0,100,100);
    narrowSign(50,50,sign,1.87,signContext);
    el('sign-name').textContent=signalNames[sign];
  }
  el('view').hidden=false;
  el('caption').textContent=narrow?'Az útszűkületben egyszerre egy autó fér el.':'Vezetői nézet az A autóból. Felülnézetben nyilak jelzik a tervezett útvonalakat.';
  el('view').textContent=driverView?'Felülnézet':'Vezetői nézet';
  const road=narrow ? 'Egysávos útszűkület. A nyitott sáv az A autó felől nézve '+(active[6].opening>0?'jobbra':'balra')+' van. ' : 'Kereszteződés. ';
  canvas.setAttribute('aria-label',road+active[2].map(label).join('. '));
  el('choices').replaceChildren(...active[2].map((car,i)=>{
    const button=document.createElement('button');
    button.className='choice';button.dataset.vehicle=ids[i];button.style.setProperty('--car',colors[i]);
    const icon=document.createElement('span');icon.className='token';icon.textContent=ids[i];icon.setAttribute('aria-hidden','true');
    const desc=document.createElement('span');desc.textContent=label(car,i).slice(4);
    const rank=document.createElement('span');rank.className='rank';
    button.append(icon,desc,rank);button.addEventListener('click',()=>select(ids[i]));return button;
  }));
  for(const id of ['instruction','choices','check','reset','map']) el(id).hidden=false;
  for(const id of ['feedback','next','restart','trial-results']) el(id).hidden=true;
  refreshChoices();showScore();drawMap();
  if(results[index] !== undefined) {
    chosen=[...results[index]];
    showAnswer(false);
  }
  if(focus)el('title').focus();
}
function select(id) {
  if(solved)return;
  if(chosen.includes(id))chosen=chosen.filter(item=>item!==id);
  else if(active[3].length===1)chosen=[id];
  else chosen.push(id);
  refreshChoices();
}
function refreshChoices() {
  for(const button of el('choices').children) {
    const id=button.dataset.vehicle;
    const rank=chosen.indexOf(id)+1;
    button.setAttribute('aria-pressed',String(rank>0));
    button.setAttribute('aria-label',label(active[2][ids.indexOf(id)],ids.indexOf(id))+(rank?' · '+rank+'. hely':''));
    button.lastElementChild.textContent=rank?rank+'.':'';
    button.disabled=solved;
  }
  el('check').disabled=chosen.length!==active[3].length;
  el('reset').disabled=chosen.length===0;
}
function animationPhases() {
  return active[6]?.animate || [...active[3]];
}
function animationDuration() {
  return animationPhases().length * phaseTime;
}
function stopPlayback() {
  cancelAnimationFrame(frame);
  playing=false;
}
function resetPlayback() {
  stopPlayback();
  elapsed=0;
  el('playback').hidden=true;
}
function drawPlayback() {
  const phases=animationPhases();
  const total=animationDuration();
  const positions={};
  phases.forEach((group,i)=>{
    for(const id of group)positions[id]=Math.max(0,Math.min(1,(elapsed-i*phaseTime)/(phaseTime-70)));
  });
  drawMap(positions);
  const status=elapsed===0?'Kiinduló helyzet':elapsed>=total?'Az áthaladás befejeződött':
    'Áthaladás: '+[...phases[Math.floor(elapsed/phaseTime)]].join(' és ');
  if(el('playback-status').textContent!==status)el('playback-status').textContent=status;
  el('timeline').setAttribute('aria-valuetext',status);
  el('timeline').value=Math.round(elapsed/total*1000);
  el('replay').textContent=playing?'Szünet':elapsed>=total?'Újrajátszás':elapsed>0?'Folytatás':'Lejátszás';
  el('previous-frame').disabled=elapsed===0;
  el('next-frame').disabled=elapsed>=total;
}
function togglePlayback() {
  if(playing){
    stopPlayback();
    drawPlayback();
    return;
  }
  if(elapsed>=animationDuration())elapsed=0;
  const start=performance.now()-elapsed;
  playing=true;
  drawPlayback();
  function tick(now) {
    elapsed=Math.min(animationDuration(),now-start);
    if(elapsed>=animationDuration())stopPlayback();
    drawPlayback();
    if(playing)frame=requestAnimationFrame(tick);
  }
  frame=requestAnimationFrame(tick);
}
function seek(time) {
  stopPlayback();
  elapsed=time;
  drawPlayback();
}
function stepPlayback(direction) {
  const midpoints=animationPhases().map((_,i)=>(i+.5)*phaseTime);
  const stops=[0,...midpoints,animationDuration()];
  const target=direction>0?stops.find(t=>t>elapsed):[...stops].reverse().find(t=>t<elapsed);
  if(target!==undefined)seek(target);
}
el('check').onclick=()=>{
  if(solved||chosen.length!==active[3].length)return;
  results[index]=chosen.join('');
  saveProgress();
  showAnswer(true);
};
function showAnswer(animate) {
  solved=true;
  if(isTrial()) {
    refreshChoices();
    showScore();
    el('check').hidden=true;
    el('reset').hidden=true;
    el('next').hidden=false;
    el('next').textContent=index===queue.length-1?'Eredmény':'Következő helyzet';
    if(animate)el('next').focus();
    return;
  }
  const correct=chosen.join('')===active[3];
  const feedback=el('feedback');feedback.dataset.result=correct?'correct':'incorrect';
  const strong=document.createElement('strong');
  strong.textContent=(correct?'Helyes. ':'A helyes megoldás. ')+[...active[3]].join(' → ');
  const explanation=document.createElement('p');explanation.textContent=active[4];
  const link=document.createElement('a');link.href=source;link.target='_blank';link.rel='noopener';link.textContent='KRESZ '+active[5];
  feedback.hidden=false;feedback.replaceChildren(strong,explanation,link);
  refreshChoices();showScore();
  el('check').hidden=true;el('reset').hidden=true;
  el('playback').hidden=false;
  drawPlayback();
  el('next').hidden=false;el('next').textContent=index===queue.length-1?'Eredmény':'Következő helyzet';
  if(animate){el('next').focus();if(!reducedMotion.matches)togglePlayback();}
}
el('reset').onclick=()=>{chosen=[];refreshChoices();el('choices').firstElementChild.focus();};
el('replay').onclick=togglePlayback;
el('timeline').oninput=()=>seek(Number(el('timeline').value)*animationDuration()/1000);
el('previous-frame').onclick=()=>stepPlayback(-1);
el('next-frame').onclick=()=>stepPlayback(1);
el('view').onclick=()=>{
  const driverView=el('view').getAttribute('aria-pressed')==='true';
  viewPreference=!driverView;
  el('view').setAttribute('aria-pressed',String(viewPreference));
  el('view').textContent=driverView?'Vezetői nézet':'Felülnézet';
  if(el('playback').hidden)drawMap();
  else drawPlayback();
};
function startRound(tasks, isReview) {
  queue=tasks;
  review=isReview;
  index=0;
  results=[];
  finished=false;
  saveProgress();
  render(true);
}
function showSummary(focus=false) {
  resetPlayback();
  drawMap();
  const missed=missedTasks();
  if(isTrial()){showTrialSummary(focus);return;}
  el('title').textContent=review?'Befejezted az ismétlést':'Befejezted a gyakorlást';
  el('scenario').textContent=queue.length+' helyzetből '+points()+' feladatot oldottál meg helyesen.';
  el('counter').textContent=review?'Ismétlés vége':'Gyakorlás vége';
  for(const id of ['instruction','choices','feedback','check','reset'])el(id).hidden=true;
  el('next').hidden=false;
  el('next').textContent=missed.length?'Hibás feladatok gyakorlása ('+missed.length+')':(topic==='all'?'Összes feladat újrakezdése':'Témakör újrakezdése');
  el('restart').textContent=topic==='all'?'Összes feladat újrakezdése':'Témakör újrakezdése';
  el('restart').hidden=!missed.length;
  showScore();
  if(focus)el('title').focus();
}
function showTrialSummary(focus) {
  el('title').textContent='Próbakör eredménye';
  el('scenario').textContent=queue.length+' helyzetből '+points()+' feladatot oldottál meg helyesen. Nyisd le a helyzeteket a magyarázathoz.';
  el('counter').textContent='Próbakör vége';
  for(const id of ['instruction','choices','feedback','check','reset','restart','map'])el(id).hidden=true;
  el('sign-panel').hidden=true;
  const list=el('trial-results');
  list.replaceChildren(...queue.map((task, i)=>{
    const [title,, ,answer,explanation]=scenarios[task];
    const item=document.createElement('li');
    const details=document.createElement('details');
    const summary=document.createElement('summary');
    summary.textContent=(results[i]===answer?'Helyes · ':'Hibás · ')+title;
    const text=document.createElement('p');
    text.textContent='Válaszod: '+[...results[i]].join(' → ')+'. Helyes megoldás: '+[...answer].join(' → ')+'. '+explanation;
    details.append(summary,text);
    item.append(details);
    return item;
  }));
  list.hidden=false;
  el('next').hidden=false;
  el('next').textContent='Új próbakör';
  showScore();
  if(focus)el('title').focus();
}
el('restart').onclick=()=>startRound(topics.get(topic),false);
el('next').onclick=()=>{
  if(finished) {
    if(isTrial()){startRound(shuffledTasks(topics.get(topic)),false);return;}
    const missed=missedTasks();
    startRound(missed.length?missed:topics.get(topic),missed.length>0);
    return;
  }
  if(index<queue.length-1){
    index++;
    saveProgress();
    render(true);
    return;
  }
  finished=true;
  saveProgress();
  showSummary(true);
};
function openTopic() {
  el('topic').value=topic;
  loadProgress();
  if(isTrial())saveProgress();
  render();
  if(finished)showSummary();
}
el('topic').onchange=()=>{
  const selected=el('topic').value;
  if(!topics.has(selected) || selected===topic)return;
  saveProgress();
  topic=selected;
  try {
    localStorage.setItem(topicStorageKey, topic);
  } catch {
    // The selection still takes effect for the current page.
  }
  openTopic();
};
openTopic();
prepareRoadMaterials();
</script>
